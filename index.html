<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百分数的应用 · 扇形统计图对比</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #FBF6EE;
    --card: #FFFFFF;
    --line: #EFE4D2;
    --ink: #3A3227;
    --ink-soft: #7A6F5F;
    --accent: #147D6E;
    --accent-dark: #0E5C51;
    --accent-soft: #E2F0EC;
    --amber: #D97A3E;
    --amber-soft: #FBEEDD;
    --danger: #DE5B49;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(90, 70, 40, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
  }
  /* ===== 头部 ===== */
  header.page-head {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 20px 8px;
  }
  .title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 20px;
  }
  h1 {
    font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: clamp(26px, 4vw, 38px);
    font-weight: 400;
    letter-spacing: 1px;
  }
  .title-row .tag {
    background: var(--accent-soft);
    color: var(--accent-dark);
    border: 1px solid #BFDDD4;
    font-size: 13px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin-top: 8px;
  }
  /* ===== 工具栏 ===== */
  .toolbar {
    max-width: 1240px;
    margin: 18px auto 0;
    padding: 0 20px;
  }
  .toolbar-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px 24px;
  }
  .tool-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 16px;
  }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px 8px 8px;
    font: 500 14px 'Noto Sans SC', sans-serif;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .switch:hover { border-color: #C9BBA0; }
  .switch:focus-visible { outline: 3px solid rgba(20,125,110,.35); outline-offset: 2px; }
  .switch .knob {
    width: 34px; height: 20px;
    background: #D9D2C4;
    border-radius: 999px;
    position: relative;
    transition: background .25s;
    flex: none;
  }
  .switch .knob::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    transition: left .25s;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .switch[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .switch[aria-checked="true"] .knob { background: var(--accent); }
  .switch[aria-checked="true"] .knob::after { left: 16px; }
  .weight-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .weight-box label {
    font-weight: 500;
    font-size: 14px;
  }
  .weight-box input {
    width: 130px;
    height: 44px;
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 0 12px;
    font: 500 17px 'Noto Sans SC', sans-serif;
    color: var(--ink);
    background: #FFFDF9;
    text-align: center;
  }
  .weight-box input:focus-visible { outline: 3px solid rgba(20,125,110,.35); border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    height: 38px;
    padding: 0 14px;
    border: 1.5px solid var(--line);
    background: #FFFDF9;
    border-radius: 999px;
    font: 500 14px 'Noto Sans SC', sans-serif;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .2s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }
  .chip.active { border-color: var(--accent); color: #fff; background: var(--accent); }
  .chip:focus-visible { outline: 3px solid rgba(20,125,110,.35); outline-offset: 2px; }
  .btn-reset {
    height: 40px;
    padding: 0 16px;
    border: 1.5px solid var(--line);
    background: #FFFDF9;
    border-radius: 10px;
    font: 500 14px 'Noto Sans SC', sans-serif;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .2s;
  }
  .btn-reset:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
  .btn-reset:focus-visible { outline: 3px solid rgba(217,122,62,.35); outline-offset: 2px; }
  .drag-hint {
    background: var(--amber-soft);
    border: 1px solid #F0D3AC;
    color: #7A4A18;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    width: 100%;
  }
  .drag-hint[hidden] { display: none; }
  /* ===== 图表区 ===== */
  main { max-width: 1240px; margin: 0 auto; padding: 18px 20px 40px; }
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    gap: 20px;
  }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    position: relative;
  }
  .chart-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .year-badge {
    font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif;
    font-size: 17px;
    padding: 3px 14px;
    border-radius: 999px;
    letter-spacing: .5px;
  }
  .year-badge.y1952 { background: var(--amber); color: #fff; }
  .year-badge.y2017 { background: var(--accent); color: #fff; }
  .chart-head .chart-name { font-size: 14px; color: var(--ink-soft); font-weight: 500; }
  .svg-wrap { display: flex; justify-content: center; }
  .svg-wrap svg { width: 100%; max-width: 400px; height: auto; display: block; }
  svg .sector {
    stroke: #fff;
    stroke-width: 2;
    cursor: pointer;
    transition: opacity .25s;
  }
  svg .sector.dim { opacity: .32; }
  svg .sector.sel { opacity: 1; animation: pulse 1.3s ease-in-out infinite; }
  svg .handle {
    cursor: grab;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .15s;
  }
  svg .handle:hover { transform: scale(1.3); }
  svg .handle.grabbing { cursor: grabbing; transform: scale(1.4); }
  svg .handle:focus-visible { outline: none; }
  svg .handle .ring {
    fill: #fff;
    stroke: rgba(60, 40, 20, .28);
    stroke-width: 1.5;
  }
  svg .handle .dot { stroke: #fff; stroke-width: 2.5; }
  svg text { pointer-events: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .45; }
  }
  @media (prefers-reduced-motion: reduce) {
    svg .sector.sel { animation: none; }
    .switch .knob, .switch .knob::after { transition: none; }
  }
  .legend {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }
  .legend button {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 6px 8px;
    font: 500 14px 'Noto Sans SC', sans-serif;
    color: var(--ink);
    cursor: pointer;
    transition: background .2s, border-color .2s;
    text-align: left;
  }
  .legend button:hover { background: #FBF5E9; }
  .legend button.sel { background: var(--accent-soft); border-color: #BFDDD4; }
  .legend button:focus-visible { outline: 3px solid rgba(20,125,110,.35); outline-offset: 1px; }
  .legend .dot { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .legend .pct { margin-left: auto; color: var(--ink-soft); font-weight: 700; }
  /* ===== 结果面板 ===== */
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .panel h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    margin-bottom: 12px;
    font-weight: 700;
  }
  .panel h3 .badge {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 10px;
  }
  .empty-tip {
    color: var(--ink-soft);
    font-size: 14px;
    background: #FBF5E9;
    border-radius: 10px;
    padding: 14px 16px;
  }
  /* 算式卡（放大镜样式） */
  .lens {
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 14px;
    padding: 16px;
    margin-top: 4px;
  }
  .lens .sel-line {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 10px;
  }
  .lens .formula {
    font-size: 26px;
    font-weight: 700;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: .5px;
    color: var(--ink);
    margin-bottom: 8px;
    word-break: break-all;
  }
  .lens .formula .num { color: var(--accent-dark); }
  .lens .steps {
    font-size: 14px;
    color: var(--ink);
    border-top: 1.5px dashed #BFDDD4;
    padding-top: 8px;
    margin-top: 4px;
  }
  .lens .steps div { margin-top: 2px; }
  .lens .answer {
    font-weight: 700;
    font-size: 15px;
    margin-top: 8px;
    color: var(--danger);
  }
  .lens .counterpart {
    border-top: 1.5px dashed #BFDDD4;
    margin-top: 12px;
    padding-top: 10px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .lens .counterpart .formula { font-size: 18px; margin-top: 2px; color: var(--ink); }
  /* 汇总卡 */
  .summary-text { font-size: 15px; }
  .summary-text .head { font-weight: 700; margin-bottom: 6px; }
  .summary-text p { margin-top: 6px; }
  .summary-text .hl { color: var(--danger); font-weight: 700; }
  .summary-text .hl2 { color: var(--accent-dark); font-weight: 700; }
  /* ===== 表格区 ===== */
  .table-section { margin-top: 20px; }
  .btn-summary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    height: 48px;
    padding: 0 26px;
    font: 600 16px 'Noto Sans SC', sans-serif;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(20,125,110,.3);
    transition: background .2s, transform .1s;
  }
  .btn-summary:hover { background: var(--accent-dark); }
  .btn-summary:active { transform: scale(.98); }
  .btn-summary:focus-visible { outline: 3px solid rgba(20,125,110,.4); outline-offset: 2px; }
  .table-wrap { margin-top: 14px; overflow-x: auto; }
  table.cmp {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    font-size: 14px;
  }
  table.cmp th, table.cmp td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    text-align: center;
    white-space: nowrap;
  }
  table.cmp thead th {
    background: #F6EFE2;
    font-weight: 700;
  }
  table.cmp tbody tr:hover { background: #FDF9F0; }
  table.cmp tbody tr.sel { background: var(--accent-soft); }
  table.cmp tbody tr.total-row { background: #F6EFE2; font-weight: 700; }
  table.cmp td.cat { text-align: left; font-weight: 500; }
  table.cmp .up { color: var(--danger); font-weight: 700; }
  table.cmp .down { color: var(--accent-dark); font-weight: 700; }
  /* ===== 页脚 ===== */
  footer {
    max-width: 1240px;
    margin: 0 auto;
    padding: 6px 20px 36px;
    color: var(--ink-soft);
    font-size: 12px;
  }
  /* 拖拽实时读数 */
  #dragReadout {
    position: fixed;
    z-index: 60;
    pointer-events: none;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 999px;
    padding: 6px 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    display: none;
  }
  /* ===== 移动端 ===== */
  @media (max-width: 768px) {
    .toolbar-card { justify-content: flex-start; }
    .weight-box { width: 100%; }
    .weight-box input { flex: 1; max-width: 200px; }
    .lens .formula { font-size: 22px; }
  }
</style>
</head>
<body>

<header class="page-head">
  <div class="title-row">
    <h1>百分数的应用 · 扇形统计图</h1>
    <span class="tag">单位 1 = 100%</span>
  </div>
  <p class="subtitle">对比 1952 年与 2017 年我国居民饮食结构：完整圆形代表全年食物总量（100%），点击扇形可查看占比对比与重量算式。</p>
</header>

<div class="toolbar">
  <div class="toolbar-card">
    <div class="tool-group">
      <button id="dragSwitch" class="switch" role="switch" aria-checked="false" aria-label="开启或关闭扇形拖拽编辑模式">
        <span class="knob"></span>
        <span class="switch-label">扇形拖拽模式</span>
      </button>
      <div class="drag-hint" id="dragHint">
        编辑模式已开启：拖动扇形<b>边上的彩色圆点（手柄）</b>，可调整该类的占比，其余扇形按比例增减（总量保持 100%）；点击扇形本体仍可查看算式与对比；也可在下方修改总重量。
      </div>
      <button id="btnReset" class="btn-reset">恢复默认数据</button>
    </div>
    <div class="tool-group">
      <div class="weight-box">
        <label for="totalInput">食物总重量（克）</label>
        <input id="totalInput" type="number" min="10" max="10000" step="50" value="1200" inputmode="numeric">
        <div class="chips" id="weightChips">
          <button class="chip" data-w="1000">1000</button>
          <button class="chip active" data-w="1200">1200</button>
          <button class="chip" data-w="1500">1500</button>
        </div>
      </div>
    </div>
  </div>
</div>

<main>
  <section class="charts-grid">
    <article class="chart-card">
      <div class="chart-head">
        <span class="year-badge y1952">1952 年</span>
        <span class="chart-name">食物构成统计图</span>
      </div>
      <div class="svg-wrap" id="chart1952"></div>
      <div class="legend" id="legend1952"></div>
    </article>
    <article class="chart-card">
      <div class="chart-head">
        <span class="year-badge y2017">2017 年</span>
        <span class="chart-name">食物构成统计图</span>
      </div>
      <div class="svg-wrap" id="chart2017"></div>
      <div class="legend" id="legend2017"></div>
    </article>
  </section>

  <section class="result-grid" id="resultPanel"></section>

  <section class="table-section">
    <button id="btnSummary" class="btn-summary">一键汇总 · 生成对比表格</button>
    <div class="table-wrap" id="tableWrap" hidden></div>
  </section>
</main>

<footer>数据参考课本《百分数的应用》情景图（1952 年与 2017 年居民饮食结构扇形统计图），用于百分数教学演示；拖拽编辑与克数计算为课堂互动拓展。</footer>

<div id="dragReadout"></div>

<script>
"use strict";

/* ===== 数据 ===== */
const CATS = {
  '1952': ['主食', '肉禽', '蛋奶', '其他'],
  '2017': ['主食', '肉禽', '奶类', '蛋类', '鲜瓜果', '其他']
};

const INIT = {
  '1952': { '主食': 93, '肉禽': 3, '蛋奶': 3, '其他': 1 },
  '2017': { '主食': 36, '肉禽': 10, '奶类': 3, '蛋类': 3, '鲜瓜果': 13, '其他': 35 }
};

const COLORS = {
  '主食': '#F2A33C',
  '肉禽': '#DE5B49',
  '蛋奶': '#758BC8',
  '蛋类': '#5B8FD9',
  '奶类': '#9A86C9',
  '鲜瓜果': '#63B674',
  '其他': '#B4AEA4'
};

/* 跨年同类映射：key 为被点击的品类，value 为另一年的同类品类列表 */
const MATCH = {
  '主食': ['主食'],
  '肉禽': ['肉禽'],
  '蛋奶': ['蛋类', '奶类'],
  '蛋类': ['蛋奶'],
  '奶类': ['蛋奶'],
  '鲜瓜果': [],
  '其他': ['其他']
};

const state = {
  total: 1200,
  dragMode: true,
  years: JSON.parse(JSON.stringify(INIT)),
  sel: { year: '1952', cat: '主食' }
};

/* ===== SVG 几何 ===== */
const CX = 150, CY = 150, R = 105;

function polar(deg, r) {
  const rad = deg * Math.PI / 180;
  return [CX + r * Math.sin(rad), CY - r * Math.cos(rad)];
}

function sectorPath(d0, d1) {
  const [x0, y0] = polar(d0, R);
  const [x1, y1] = polar(d1, R);
  const large = (d1 - d0) > 180 ? 1 : 0;
  return 'M ' + CX + ' ' + CY + ' L ' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
         ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z';
}

/* 把指针事件坐标换算为角度（0° 在正上方，顺时针） */
function angleFromEvent(e, svg) {
  const rect = svg.getBoundingClientRect();
  const scale = rect.width / 300;
  const vx = (e.clientX - rect.left) / scale;
  const vy = (e.clientY - rect.top) / scale;
  let a = Math.atan2(vx - CX, CY - vy) * 180 / Math.PI;
  if (a < 0) a += 360;
  return a;
}

/* ===== 状态更新 ===== */
function renorm(year, draggedCat, newPct) {
  const cats = CATS[year];
  const n = cats.length;
  const maxPct = 100 - (n - 1);
  newPct = Math.max(1, Math.min(maxPct, Math.round(newPct)));
  const others = cats.filter(function (c) { return c !== draggedCat; });
  const rem = 100 - newPct;
  const origSum = others.reduce(function (s, c) { return s + state.years[year][c]; }, 0) || 1;
  let used = 0;
  const alloc = {};
  others.forEach(function (c, i) {
    if (i === others.length - 1) {
      alloc[c] = rem - used;
    } else {
      const left = others.length - i - 1;
      let v = Math.max(1, Math.round(rem * state.years[year][c] / origSum));
      v = Math.min(v, rem - used - left);
      v = Math.max(v, 1);
      alloc[c] = v;
      used += v;
    }
  });
  state.years[year][draggedCat] = newPct;
  others.forEach(function (c) { state.years[year][c] = alloc[c]; });
}

function setTotal(v) {
  v = Math.round(Number(v));
  if (!isFinite(v) || v < 10) v = 10;
  if (v > 10000) v = 10000;
  state.total = v;
  document.getElementById('totalInput').value = v;
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
    b.classList.toggle('active', Number(b.dataset.w) === v);
  });
}

function select(year, cat) {
  state.sel = { year: year, cat: cat };
  update();
}

/* ===== 渲染 ===== */
function renderYear(year) {
  const container = document.getElementById('chart' + year);
  const legendBox = document.getElementById('legend' + year);
  const cats = CATS[year];
  const data = state.years[year];
  const sel = state.sel;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 300 300');

  let acc = 0;
  let tiny = [];
  const handles = [];
  cats.forEach(function (cat, idx) {
    const pct = data[cat];
    const d0 = acc * 3.6, d1 = (acc + pct) * 3.6;
    acc += pct;
    handles.push({ cat: cat, angle: d1 % 360 });
    const mid = (d0 + d1) / 2;
    const isSel = sel && sel.year === year && sel.cat === cat;
    const isMatch = sel && sel.year !== year && MATCH[sel.cat] && MATCH[sel.cat].indexOf(cat) >= 0;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', sectorPath(d0, d1));
    path.setAttribute('fill', COLORS[cat]);
    path.setAttribute('class', 'sector' + (isSel ? ' sel' : (isMatch ? '' : ' dim')));
    path.setAttribute('tabindex', '0');
    path.setAttribute('role', 'button');
    path.setAttribute('aria-label', year + '年 ' + cat + ' 占 ' + pct + '%');
    path.style.touchAction = 'none';
    bindSector(path, year, cat, pct);
    svg.appendChild(path);

    if (pct >= 10) {
      const [tx, ty] = polar(mid, 68);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', tx.toFixed(1));
      t.setAttribute('y', ty.toFixed(1));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('fill', '#fff');
      t.setAttribute('font-size', '13');
      t.setAttribute('font-weight', '700');
      t.style.paintOrder = 'stroke';
      t.style.stroke = 'rgba(60, 40, 20, .4)';
      t.style.strokeWidth = '3px';
      const line1 = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      line1.setAttribute('x', tx.toFixed(1));
      line1.setAttribute('dy', '-1');
      line1.textContent = cat;
      const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      line2.setAttribute('x', tx.toFixed(1));
      line2.setAttribute('dy', '17');
      line2.setAttribute('font-size', '17');
      line2.textContent = pct + '%';
      t.appendChild(line1);
      t.appendChild(line2);
      svg.appendChild(t);
    } else {
      tiny.push({ cat: cat, pct: pct, mid: mid, idx: idx });
    }
  });

  /* 小扇形（<10%）标签：引出线 + 外部文字，相邻标签纵向错开 */
  const nTiny = tiny.length;
  tiny.forEach(function (item, i) {
    const [lx, ly] = polar(item.mid, 100);
    const [ex, ey] = polar(item.mid, 123);
    const off = (i - (nTiny - 1) / 2) * 17;
    const labelY = ey + off;
    const leftSide = ex < CX;
    const textX = leftSide ? ex - 8 : ex + 8;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', lx.toFixed(1)); line.setAttribute('y1', ly.toFixed(1));
    line.setAttribute('x2', textX.toFixed(1)); line.setAttribute('y2', labelY.toFixed(1));
    line.setAttribute('stroke', COLORS[item.cat]);
    line.setAttribute('stroke-width', '2');
    svg.appendChild(line);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', textX.toFixed(1));
    t.setAttribute('y', labelY.toFixed(1));
    t.setAttribute('text-anchor', leftSide ? 'end' : 'start');
    t.setAttribute('fill', '#4A4234');
    t.setAttribute('font-size', '12');
    t.setAttribute('font-weight', '700');
    t.textContent = item.cat + ' ' + item.pct + '%';
    svg.appendChild(t);
  });

  /* 中心标注：总量 = 100% */
  const c1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  c1.setAttribute('x', CX); c1.setAttribute('y', CY - 2);
  c1.setAttribute('text-anchor', 'middle');
  c1.setAttribute('fill', '#5A5145');
  c1.setAttribute('font-size', '13');
  c1.setAttribute('font-weight', '700');
  c1.textContent = '食物总量';
  const c2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  c2.setAttribute('x', CX); c2.setAttribute('y', CY + 15);
  c2.setAttribute('text-anchor', 'middle');
  c2.setAttribute('fill', '#3A3227');
  c2.setAttribute('font-size', '15');
  c2.setAttribute('font-weight', '700');
  c2.textContent = '100%';
  svg.appendChild(c1);
  svg.appendChild(c2);

  renderHandles(svg, year, handles, data);

  container.innerHTML = '';
  container.appendChild(svg);

  /* 图例 */
  legendBox.innerHTML = '';
  cats.forEach(function (cat) {
    const isSel = sel && sel.year === year && sel.cat === cat;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = isSel ? 'sel' : '';
    btn.setAttribute('aria-label', year + '年 ' + cat + ' 占 ' + data[cat] + '%');
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = COLORS[cat];
    const name = document.createElement('span');
    name.textContent = cat;
    const pct = document.createElement('span');
    pct.className = 'pct';
    pct.textContent = data[cat] + '%';
    btn.appendChild(dot);
    btn.appendChild(name);
    btn.appendChild(pct);
    btn.addEventListener('click', function () { select(year, cat); });
    legendBox.appendChild(btn);
  });
}

/* 扇形本体：点击选中（拖拽调整由手柄负责，二者分离） */
function bindSector(path, year, cat) {
  path.addEventListener('click', function () {
    select(year, cat);
  });
  path.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      select(year, cat);
    }
  });
}

/* ===== 拖拽手柄 =====
   每个扇形尾边有一个彩色圆点手柄：
   - 抓住手柄沿圆盘边缘滑动，扇形大小随之变化（方向与手感一致）；
   - 点击扇形本体不受影响，二者互不干扰。 */
function renderHandles(svg, year, handles, data) {
  if (!state.dragMode) return;
  /* 占比低于 3% 的扇形太窄，放不下手柄，不显示（点击看算式即可） */
  const hs = handles.filter(function (h) { return data[h.cat] >= 3; });
  if (!hs.length) return;
  const n = hs.length;
  function arcDist(a, b) {
    let d = Math.abs(a - b) % 360;
    if (d > 180) d = 360 - d;
    return d;
  }
  /* 单向扫描：每个手柄只与前一个有手柄的保持距离，
     间距不足时自动向外错开（105 → 117 → 132），避免小扇形手柄挤在一起 */
  hs.forEach(function (h, i) {
    const prev = hs[(i - 1 + n) % n];
    const dP = arcDist(h.angle, prev.angle);
    let r = 105;
    if (dP < 22) r = 117;
    if (dP < 10) r = 132;
    h.r = r;
  });
  hs.forEach(function (h) {
    const [hx, hy] = polar(h.angle, h.r);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'handle');
    g.setAttribute('role', 'slider');
    g.setAttribute('tabindex', '0');
    g.setAttribute('aria-label', '拖动调整' + h.cat + '的占比，当前为' + data[h.cat] + '%');
    g.setAttribute('title', '拖动调整' + h.cat + '的占比');
    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    ring.setAttribute('class', 'ring');
    ring.setAttribute('cx', hx.toFixed(1)); ring.setAttribute('cy', hy.toFixed(1));
    ring.setAttribute('r', 8);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('class', 'dot');
    dot.setAttribute('cx', hx.toFixed(1)); dot.setAttribute('cy', hy.toFixed(1));
    dot.setAttribute('r', 5);
    dot.setAttribute('fill', COLORS[h.cat]);
    g.appendChild(ring);
    g.appendChild(dot);
    bindHandle(g, year, h.cat, svg);
    svg.appendChild(g);
  });
}

function bindHandle(g, year, cat, svg) {
  /* 按下手柄：记录起点，后续移动/松手交给 window 级处理器
     （拖拽期间图表每帧重绘、手柄会被销毁重建，事件挂在 window 上才能持续不断） */
  g.addEventListener('pointerdown', function (e) {
    if (!state.dragMode || activeDrag) return;
    e.preventDefault();
    e.stopPropagation();
    activeDrag = {
      year: year,
      cat: cat,
      startPct: state.years[year][cat],
      startAngle: angleFromEvent(e, svg)
    };
    g.classList.add('grabbing');
    showReadout(cat + ' ' + state.years[year][cat] + '%', e);
  });

  /* 键盘微调：方向键每次增减 1 个百分点 */
  g.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
      e.preventDefault();
      renorm(year, cat, state.years[year][cat] + 1);
      update();
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
      e.preventDefault();
      renorm(year, cat, state.years[year][cat] - 1);
      update();
    }
  });
}

/* 全局拖拽状态：移动/松开事件挂在 window 上，
   即使图表重绘、手柄被替换，拖拽也不会中断 */
let activeDrag = null;

window.addEventListener('pointermove', function (e) {
  if (!activeDrag) return;
  const wrap = document.getElementById('chart' + activeDrag.year);
  const svg = wrap ? wrap.querySelector('svg') : null;
  if (!svg) return;
  const a = angleFromEvent(e, svg);
  let d = a - activeDrag.startAngle;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  renorm(activeDrag.year, activeDrag.cat, activeDrag.startPct + d / 3.6);
  update();
  showReadout(activeDrag.cat + ' ' + state.years[activeDrag.year][activeDrag.cat] + '%', e);
});

function endDrag() {
  if (!activeDrag) return;
  activeDrag = null;
  hideReadout();
  update();
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', endDrag);

/* ===== 拖拽读数气泡 ===== */
function showReadout(text, e) {
  const el = document.getElementById('dragReadout');
  el.textContent = text;
  el.style.display = 'block';
  el.style.left = (e.clientX + 14) + 'px';
  el.style.top = (e.clientY + 14) + 'px';
}
function hideReadout() {
  document.getElementById('dragReadout').style.display = 'none';
}

/* ===== 结果面板 ===== */
function fmtDecimal(pct) {
  return String(pct / 100);
}

function buildFormula(year, cat) {
  const pct = state.years[year][cat];
  const w = Math.round(state.total * pct / 100);
  return {
    pct: pct,
    w: w,
    decimal: fmtDecimal(pct)
  };
}

function renderResult() {
  const box = document.getElementById('resultPanel');
  const sel = state.sel;
  if (!sel) {
    box.innerHTML = '<section class="panel"><h3>结果区</h3><div class="empty-tip">点击左侧或右侧的任意扇形，查看该类的两年对比与克数算式。</div></section>';
    return;
  }

  const year = sel.year, cat = sel.cat;
  const otherYear = year === '1952' ? '2017' : '1952';
  const f = buildFormula(year, cat);

  /* 汇总文字（规则化“AI 分析”） */
  let summary = '';
  const data = state.years;
  const counterparts = MATCH[cat] || [];

  if (cat === '蛋类' || cat === '奶类') {
    const a = data['1952']['蛋奶'];
    const b = data['2017']['蛋类'] + data['2017']['奶类'];
    const diff = b - a;
    summary = '<div class="head">' + cat + '（1952 年合称“蛋奶”）</div>';
    summary += '<p>1952 年“蛋奶”合计占 <span class="hl">' + a + '%</span>；2017 年分开统计：蛋类 ' + data['2017']['蛋类'] + '%、奶类 ' + data['2017']['奶类'] + '%，合计 <span class="hl">' + b + '%</span>。';
    summary += '<p>' + changeText(diff) + '。';
  } else if (cat === '蛋奶') {
    const a = data['1952']['蛋奶'];
    const b = data['2017']['蛋类'] + data['2017']['奶类'];
    const diff = b - a;
    summary = '<div class="head">蛋奶</div>';
    summary += '<p>1952 年“蛋奶”占 <span class="hl">' + a + '%</span>；2017 年分为蛋类 ' + data['2017']['蛋类'] + '%、奶类 ' + data['2017']['奶类'] + '%，合计 <span class="hl">' + b + '%</span>。';
    summary += '<p>' + changeText(diff) + '。';
  } else if (counterparts.length > 0) {
    const a = data['1952'][cat];
    const b = data['2017'][cat];
    const diff = b - a;
    const dir = diff > 0 ? '上升' : (diff < 0 ? '下降' : '基本持平');
    summary = '<div class="head">' + cat + '</div>';
    summary += '<p>1952 年占 <span class="hl">' + a + '%</span>，2017 年占 <span class="hl2">' + b + '%</span>，' + dir + ' <span class="hl">' + Math.abs(diff) + '</span> 个百分点。';
    summary += '<p>' + magnitudeText(Math.abs(diff)) + (diff < 0 ? '，说明人们吃得越来越多样。' : (diff > 0 ? '，说明这类食物越来越重要。' : '。'));
    if (diff !== 0) {
      const wa = Math.round(state.total * a / 100);
      const wb = Math.round(state.total * b / 100);
      summary += '<p>按总重量 ' + state.total + ' 克计算，从约 <span class="hl">' + wa + '</span> 克变为约 <span class="hl2">' + wb + '</span> 克，' + (diff < 0 ? '少吃了' : '多吃了') + ' <span class="hl">' + Math.abs(wa - wb) + '</span> 克。';
    }
  } else {
    /* 鲜瓜果：1952 年未单列 */
    const b = data['2017'][cat];
    summary = '<div class="head">' + cat + '</div>';
    summary += '<p>1952 年的统计中没有单独列出' + cat + '（可能被归入“其他”），2017 年占 <span class="hl2">' + b + '%</span>。';
    summary += '<p>说明如今水果在人们饮食中有了明确的位置，饮食结构更加丰富多样。';
  }

  function changeText(diff) {
    if (diff > 0) return '比 1952 年增加 <span class="hl">' + diff + '</span> 个百分点';
    if (diff < 0) return '比 1952 年减少 <span class="hl">' + Math.abs(diff) + '</span> 个百分点';
    return '与 1952 年基本持平';
  }
  function magnitudeText(absDiff) {
    if (absDiff >= 30) return '变化幅度很大';
    if (absDiff >= 10) return '变化比较明显';
    if (absDiff >= 1) return '变化不大';
    return '几乎没有变化';
  }

  /* 算式卡 */
  const dec = f.decimal;
  let counterpartHtml = '';
  if (cat === '蛋奶') {
    const sumPct = data['2017']['蛋类'] + data['2017']['奶类'];
    const sumW = Math.round(state.total * sumPct / 100);
    counterpartHtml =
      '<div class="counterpart">对比 2017 年（蛋类 + 奶类）：占 ' + sumPct + '%' +
      '<div class="formula">' + state.total + ' × （' + data['2017']['蛋类'] + '% + ' + data['2017']['奶类'] + '%） = ' + state.total + ' × ' + sumPct + '% = ' + sumW + '（克）</div>' +
      '<div class="steps">先把蛋类与奶类的百分比相加：' + data['2017']['蛋类'] + '% + ' + data['2017']['奶类'] + '% = ' + sumPct + '%</div></div>';
  } else if (counterparts.length > 0) {
    const cCat = counterparts[0];
    const cp = buildFormula(otherYear, cCat);
    counterpartHtml =
      '<div class="counterpart">对比 ' + otherYear + ' 年：' + cCat + ' 占 ' + cp.pct + '%' +
      '<div class="formula">' + state.total + ' × ' + cp.pct + '% = ' + cp.w + '（克）</div>' +
      '<div class="steps">' + cp.pct + '% = ' + cp.decimal + '，' + state.total + ' × ' + cp.decimal + ' = ' + cp.w + '</div></div>';
  }

  box.innerHTML =
    '<section class="panel">' +
      '<h3>计算算式 <span class="badge">总重量 ' + state.total + ' 克</span></h3>' +
      '<div class="lens">' +
        '<div class="sel-line">你点到了：' + year + ' 年 · ' + cat + '（占 ' + f.pct + '%）</div>' +
        '<div class="formula">' + state.total + ' × ' + f.pct + '% = <span class="num">' + f.w + '</span>（克）</div>' +
        '<div class="steps">' +
          '<div>分步：先把 ' + f.pct + '% 写成小数 —— ' + f.pct + '% = ' + dec + '</div>' +
          '<div>再算：' + state.total + ' × ' + dec + ' = ' + f.w + '</div>' +
        '</div>' +
        '<div class="answer">答：' + year + ' 年 ' + cat + ' 每天约摄入 ' + f.w + ' 克。</div>' +
        counterpartHtml +
      '</div>' +
    '</section>' +
    '<section class="panel">' +
      '<h3>AI 对比分析</h3>' +
      '<div class="summary-text">' + summary + '</div>' +
    '</section>';
}

/* ===== 一键汇总表格 ===== */
let tableVisible = false;

function renderTable() {
  const wrap = document.getElementById('tableWrap');
  const y52 = state.years['1952'];
  const y17 = state.years['2017'];
  const sel = state.sel;

  const rows = [
    { name: '主食', a: y52['主食'], b: y17['主食'], match: ['主食'] },
    { name: '肉禽', a: y52['肉禽'], b: y17['肉禽'], match: ['肉禽'] },
    { name: '蛋类、奶类', a: y52['蛋奶'], b: y17['蛋类'] + y17['奶类'], match: ['蛋类', '奶类', '蛋奶'], note: '1952 年合称“蛋奶”' },
    { name: '鲜瓜果', a: null, b: y17['鲜瓜果'], match: ['鲜瓜果'] },
    { name: '其他', a: y52['其他'], b: y17['其他'], match: ['其他'] }
  ];

  const selRow = sel ? rows.findIndex(function (r) {
    return r.match.indexOf(sel.cat) >= 0;
  }) : -1;

  let html =
    '<table class="cmp">' +
    '<thead><tr>' +
      '<th>食物品类</th><th>1952 年占比</th><th>2017 年占比</th>' +
      '<th>1952 年重量（克）</th><th>2017 年重量（克）</th><th>变化（百分点）</th>' +
    '</tr></thead><tbody>';

  let totalA = 0, totalB = 0;
  rows.forEach(function (r, i) {
    const wA = r.a === null ? null : Math.round(state.total * r.a / 100);
    const wB = r.b === null ? null : Math.round(state.total * r.b / 100);
    if (r.a !== null) totalA += r.a;
    if (r.b !== null) totalB += r.b;
    const diff = (r.a !== null && r.b !== null) ? r.b - r.a : null;
    const diffTxt = diff === null ? '—' :
      (diff > 0 ? '<span class="up">+' + diff + '</span>' :
       (diff < 0 ? '<span class="down">' + diff + '</span>' : '0'));
    html += '<tr' + (i === selRow ? ' class="sel"' : '') + '>' +
      '<td class="cat">' + r.name + (r.note ? '<br><small style="color:#7A6F5F">' + r.note + '</small>' : '') + '</td>' +
      '<td>' + (r.a === null ? '—' : r.a + '%') + '</td>' +
      '<td>' + (r.b === null ? '—' : r.b + '%') + '</td>' +
      '<td>' + (wA === null ? '—' : wA) + '</td>' +
      '<td>' + (wB === null ? '—' : wB) + '</td>' +
      '<td>' + diffTxt + '</td>' +
    '</tr>';
  });

  const sumA = Math.round(state.total * totalA / 100);
  const sumB = Math.round(state.total * totalB / 100);
  html += '<tr class="total-row">' +
    '<td class="cat">合计</td>' +
    '<td>' + totalA + '%</td><td>' + totalB + '%</td>' +
    '<td>' + sumA + '</td><td>' + sumB + '</td>' +
    '<td></td>' +
  '</tr>';

  html += '</tbody></table>' +
    '<p style="font-size:12px;color:#7A6F5F;margin-top:8px;">重量按食物总重量 ' + state.total + ' 克计算：重量 = 总重量 × 占比。</p>';
  wrap.innerHTML = html;
}

document.getElementById('btnSummary').addEventListener('click', function () {
  tableVisible = true;
  document.getElementById('tableWrap').hidden = false;
  renderTable();
});

/* ===== 工具栏事件 ===== */
const dragSwitch = document.getElementById('dragSwitch');
function syncSwitchUI() {
  dragSwitch.setAttribute('aria-checked', String(state.dragMode));
  document.getElementById('dragHint').hidden = !state.dragMode;
  dragSwitch.querySelector('.switch-label').textContent =
    state.dragMode ? '编辑模式已开启' : '编辑模式（拖拽调整占比）';
}
dragSwitch.addEventListener('click', function () {
  state.dragMode = !state.dragMode;
  syncSwitchUI();
  update();
});

const totalInput = document.getElementById('totalInput');
totalInput.addEventListener('input', function () {
  setTotal(totalInput.value);
  update();
});

document.getElementById('weightChips').addEventListener('click', function (e) {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  setTotal(Number(btn.dataset.w));
  update();
});

/* 恢复默认：两年占比与总重量回到初始值（拖过头了可一键还原） */
document.getElementById('btnReset').addEventListener('click', function () {
  state.years = JSON.parse(JSON.stringify(INIT));
  setTotal(1200);
  update();
});

/* ===== 全局刷新 ===== */
function update() {
  renderYear('1952');
  renderYear('2017');
  renderResult();
  if (tableVisible) renderTable();
}

/* ===== 启动 ===== */
syncSwitchUI();
update();
</script>
